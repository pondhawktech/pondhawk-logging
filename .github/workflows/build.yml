name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Test
        run: dotnet run --project build/Build.csproj -- --target=Test

      # The Journald sink against the runner's journald, read back with journalctl. The runner user cannot read
      # the system journal, hence sudo.
      - name: Journald live test
        run: dotnet test test/Pondhawk.Logging.Journald.Tests --configuration Release --no-build --filter Category=Journald
        env:
          JOURNALD_LIVE: '1'
          JOURNALD_LIVE_JOURNALCTL: sudo journalctl

      # A prerelease of the next patch, so a build never claims a released version.
      - name: Resolve version
        id: version
        if: github.ref == 'refs/heads/main'
        run: dotnet run --project build/Build.csproj -- --target=Version --next=true --suffix=ci.${{ github.run_number }}

      - name: Pack
        if: github.ref == 'refs/heads/main'
        run: dotnet run --project build/Build.csproj -- --target=Pack --exclusive --package-version=${{ steps.version.outputs.version }}

      - name: Push
        if: github.ref == 'refs/heads/main'
        run: dotnet run --project build/Build.csproj -- --target=Push --exclusive
        env:
          NUGET_SOURCE: https://nuget.pkg.github.com/pondhawktech/index.json
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
          retention-days: 30

  # The Winston transport (Node.js). Not packed or published: CI only builds and tests it.
  winston:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/winston-pondhawk-watch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/winston-pondhawk-watch/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Runtime dependencies only: a high or critical advisory fails the build.
      - name: No vulnerable packages
        run: npm audit --omit=dev --audit-level=high
